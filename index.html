<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexão — Mecânica dos Sólidos | Seminário</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- CABEÇALHO SUPERIOR COM NAVEGAÇÃO -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-logo">σ=My/I</div>
      <div class="brand-titles">
        <span class="brand-eyebrow">Mecânica dos Sólidos · Eng. Civil & Produção</span>
        <h1>Flexão em Vigas: Teoria, Ensaio & Otimização</h1>
      </div>
    </div>

    <nav class="module-nav" id="moduleNav" aria-label="Módulos">
      <!-- Populado via JS -->
    </nav>

    <div class="topbar-controls">
      <button id="btnPrev" class="ctrl-btn" title="Anterior (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>

      <button id="btnPlayPause" class="ctrl-btn ctrl-btn--play" title="Pausar / Continuar (Espaço)">
        <span id="playIcon">⏸</span>
        <span id="playLabel">PAUSAR</span>
      </button>

      <button id="btnRestart" class="ctrl-btn" title="Reiniciar Animação (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>

      <button id="btnNext" class="ctrl-btn" title="Próximo (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>

      <button id="btnPresenter" class="ctrl-btn ctrl-btn--accent" title="Modo Apresentador (N)">
        🎤
      </button>
    </div>
  </header>

  <!-- PALCO PRINCIPAL -->
  <main id="stage" class="stage"></main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <div class="footer-hints">
      <span><kbd>←</kbd> <kbd>→</kbd> Trocar Módulo</span>
      <span><kbd>Espaço</kbd> Play/Pause</span>
      <span><kbd>R</kbd> Reiniciar</span>
      <span><kbd>N</kbd> Apresentador</span>
    </div>
    <div class="footer-timer">
      Ciclo: <span id="cycleTimer">0.0s</span> / 5.0s
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="js/slidesData.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
