<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexão em Vigas — Seminário de Mecânica dos Sólidos</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand"><span class="brand-logo">σ=My/I</span><span class="brand-name">Flexão em Vigas</span></div>
    <nav class="module-nav" id="moduleNav" aria-label="Módulos"></nav>
    <div class="controls">
      <button id="btnPrev" class="ctrl" title="Anterior (← ou PageUp)">‹</button>
      <button id="btnPlay" class="ctrl ctrl--play" title="Animar / pausar (Espaço)">▶ Animar</button>
      <button id="btnNext" class="ctrl" title="Próximo (→ ou PageDown)">›</button>
      <button id="btnPresenter" class="ctrl" title="Janela do apresentador (N)">Apresentador</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <footer class="footer" id="footer">
    <span class="hints"><kbd>←</kbd> <kbd>→</kbd> tela · <kbd>1</kbd>–<kbd>6</kbd> módulo · <kbd>Espaço</kbd> animar · <kbd>R</kbd> reiniciar · <kbd>N</kbd> apresentador · <kbd>F</kbd> tela cheia</span>
    <span class="counter" id="counter"></span>
  </footer>

  <script src="js/slidesData.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
