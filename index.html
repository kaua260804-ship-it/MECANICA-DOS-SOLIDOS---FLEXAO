<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexão — Mecânica dos Sólidos | Seminário Interativo</title>
  <meta name="description" content="Seminário interativo sobre Flexão — Eng. Civil e Eng. de Produção." />

  <!-- KaTeX via CDN (com fallback offline detectado em JS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/slides/module1.css" />
  <link rel="stylesheet" href="css/slides/module2.css" />
  <link rel="stylesheet" href="css/slides/module3.css" />
  <link rel="stylesheet" href="css/slides/module4-6.css" />
</head>
<body>

  <header class="topbar" role="banner">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">◬</span>
      <div class="topbar__titles">
        <h1>Flexão — Mecânica dos Sólidos</h1>
        <p>Seminário Interativo · Eng. Civil × Eng. de Produção</p>
      </div>
    </div>

    <div class="topbar__progress" aria-hidden="true">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">1 / 6</span>
    </div>

    <nav class="topbar__controls" aria-label="Controles de apresentação">
      <button id="btnPresenter" class="btn btn--ghost" title="Cola do apresentador (N)">
        <span aria-hidden="true">🎤</span> <span class="btn__label">Apresentador</span>
      </button>
      <button id="btnExplorer" class="btn btn--ghost" title="Modo explorador (rolagem livre)">
        <span aria-hidden="true">🔎</span> <span class="btn__label">Explorador</span>
      </button>
      <button id="btnFullscreen" class="btn btn--primary" title="Tela cheia (F)">
        <span aria-hidden="true">⛶</span> <span class="btn__label">Tela Cheia</span>
      </button>
    </nav>
  </header>

  <main id="stage" class="stage" role="main" aria-live="polite"></main>

  <footer class="navbar" role="navigation" aria-label="Navegação entre módulos">
    <button id="btnPrev" class="navbtn navbtn--prev" title="Anterior (←)">← Anterior</button>
    <div class="dots" id="dotsNav" role="tablist" aria-label="Módulos"></div>
    <button id="btnNext" class="navbtn navbtn--next" title="Próximo (→)">Próximo →</button>
  </footer>

  <aside class="shortcut-hint" aria-hidden="true">
    <span><kbd>←</kbd><kbd>→</kbd> navegar</span>
    <span><kbd>F</kbd> tela cheia</span>
    <span><kbd>N</kbd> apresentador</span>
  </aside>

  <!-- Scripts: ordem importa -->
  <script src="js/data/slidesData.js"></script>
  <script src="js/components/beamSimulator.js"></script>
  <script src="js/components/sectionComparator.js"></script>
  <script src="js/components/timelineAnimator.js"></script>
  <script src="js/components/reactionAnimator.js"></script>
  <script src="js/components/deformationAnimator.js"></script>
  <script src="js/views/moduleViews.js"></script>
  <script src="js/views/katexLoader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
